name: kung-fu-chess

services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kung-fu-chess-server:compose
    environment:
      KFC_SERVER_PORT: "${KFC_SERVER_PORT:-8080}"
      KFC_SERVER_BIND_ADDRESS: "${KFC_SERVER_BIND_ADDRESS:-0.0.0.0}"
      KFC_DATABASE_PATH: "${KFC_DATABASE_PATH:-/data/kungfu_chess.db}"
    expose:
      - "8080"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped
    networks:
      - private-network

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      game-server:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${KFC_PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - private-network

networks:
  private-network:
    name: kung-fu-chess-private
    driver: bridge

volumes:
  sqlite-data:
    name: kung-fu-chess-sqlite-data
