name: kung-fu-chess

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: "${KFC_POSTGRES_DATABASE:-kungfu_chess}"
      POSTGRES_USER: "${KFC_POSTGRES_ADMIN_USER:-kfc_admin}"
      POSTGRES_PASSWORD: "${KFC_POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env and set KFC_POSTGRES_ADMIN_PASSWORD}"
      KFC_POSTGRES_USER: "${KFC_POSTGRES_USER:-kfc}"
      KFC_POSTGRES_PASSWORD: "${KFC_POSTGRES_PASSWORD:?Copy .env.example to .env and set KFC_POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - private-network

  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kung-fu-chess-server:compose
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      KFC_SERVER_PORT: "${KFC_SERVER_PORT:-8080}"
      KFC_SERVER_BIND_ADDRESS: "${KFC_SERVER_BIND_ADDRESS:-0.0.0.0}"
      KFC_DATABASE_TYPE: "postgresql"
      KFC_POSTGRES_HOST: "${KFC_POSTGRES_HOST:-postgres}"
      KFC_POSTGRES_PORT: "${KFC_POSTGRES_PORT:-5432}"
      KFC_POSTGRES_DATABASE: "${KFC_POSTGRES_DATABASE:-kungfu_chess}"
      KFC_POSTGRES_USER: "${KFC_POSTGRES_USER:-kfc}"
      KFC_POSTGRES_PASSWORD: "${KFC_POSTGRES_PASSWORD:?Copy .env.example to .env and set KFC_POSTGRES_PASSWORD}"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - private-network

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      game-server:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${KFC_PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - private-network

networks:
  private-network:
    name: kung-fu-chess-private
    driver: bridge

volumes:
  postgres-data:
    name: kung-fu-chess-postgres-data
